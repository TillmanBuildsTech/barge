# GoReleaser v2. Run by .github/workflows/release.yml on a v* tag.
# Local dry run (no signing or SBOM tools needed):
#   goreleaser release --snapshot --clean --skip=sign,sbom
version: 2
project_name: barge

before:
  hooks:
    - go mod verify

builds:
  - id: barge
    main: ./cmd/barge
    binary: barge
    env:
      - CGO_ENABLED=0 # static binaries, no libc dependency
    flags:
      - -trimpath # no build-machine paths in the binary
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible: same commit, same bytes
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64 # untested; add when there is a runner to test on

archives:
  - id: barge
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - barge.example.yaml
      - docs/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# One SBOM (SPDX) per archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless cosign signature over the checksum file (which covers every archive).
# Verify with the command in docs/verifying-releases.md.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs?:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  prerelease: auto # v0.x and -rc tags are marked as pre-releases
  draft: false
