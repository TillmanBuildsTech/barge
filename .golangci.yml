# golangci-lint v2 configuration
version: "2"
run:
  timeout: 5m
linters:
  settings:
    wrapcheck:
      # Errors from our own packages already carry context and domain
      # sentinels; re-wrapping them only adds noise.
      ignore-package-globs:
        - github.com/TillmanBuildsTech/barge/internal/*
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - noctx
    - nilerr
    - prealloc
    - revive
    - unparam
    - wrapcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck]
formatters:
  enable: [gofmt, goimports]
