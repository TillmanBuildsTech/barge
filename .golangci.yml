# golangci-lint v2 configuration
version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - noctx
    - nilerr
    - prealloc
    - revive
    - unparam
    - wrapcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck]
formatters:
  enable: [gofmt, goimports]
