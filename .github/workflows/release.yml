name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release and upload assets
      id-token: write      # keyless cosign signing and build attestation (OIDC)
      attestations: write  # publish the build provenance attestation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser needs tags and history for the changelog
      - uses: actions/setup-go@v7
        with:
          # go.mod's version is only the minimum. Build with the newest patch so
          # the shipped binaries carry the latest standard-library fixes.
          go-version: 1.26.x
          check-latest: true
      # Gate: a tag never publishes anything that fails tests or has known vulnerabilities.
      - run: go test -race -shuffle=on ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
