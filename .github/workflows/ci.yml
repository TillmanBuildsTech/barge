name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod's 1.26.0 is only the minimum. Build with the newest 1.26 patch
          # so stdlib CVE fixes apply (govulncheck fails on unpatched stdlib).
          go-version: 1.26.x
          check-latest: true
      - run: go vet ./...
      - run: go test -race -shuffle=on ./...
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod's 1.26.0 is only the minimum. Build with the newest 1.26 patch
          # so stdlib CVE fixes apply (govulncheck fails on unpatched stdlib).
          go-version: 1.26.x
          check-latest: true
      - run: make cover tidy-check cross
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod's 1.26.0 is only the minimum. Build with the newest 1.26 patch
          # so stdlib CVE fixes apply (govulncheck fails on unpatched stdlib).
          go-version: 1.26.x
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: go test -race -tags=integration ./...
